<!DOCTYPE html>
<html>
<head>
    <title>Spoo's Profile</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            text-align: center;
            padding: 40px;
        }

        .profile {
            background-color: white;
            width: 350px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .profile img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
        }

        h1 {
            margin-bottom: 5px;
        }

        h3 {
            color: #555;
        }

        p {
            color: #666;
            line-height: 1.6;
        }

        .button {
            display: block;
            background-color: #222;
            color: white;
            padding: 12px;
            margin: 10px;
            border-radius: 8px;
            text-decoration: none;
        }

        .button:hover {
            background-color: #555;
        }
    </style>
</head>

<body>

    <div class="profile">

        <!-- Profile photo -->
        <img src="profile.jpg" alt="Profile Photo">

        <h1>Spoo</h1>

        <h3>B.E. AIML Student</h3>

        <p>
            Hello! I am a second-year B.E. Artificial Intelligence
            and Machine Learning student.
        </p>

        <p>
            I am learning Python, C, Problem Solving and
            Artificial Intelligence.
        </p>

        <a href="#" class="button">My Projects</a>

        <a href="#" class="button">LinkedIn</a>

        <a href="#" class="button">GitHub</a>

    </div>

</body>
</html>
